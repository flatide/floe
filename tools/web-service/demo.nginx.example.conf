# Example only. Include at nginx http{} level on a dedicated demo origin.
# Replace hostname, certificate paths, upstream port and private header include.
map $http_upgrade $floe_demo_connection {
    default upgrade;
    ''      close;
}
limit_req_zone $binary_remote_addr zone=floe_demo_requests:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=floe_demo_launches:1m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=floe_demo_connections:1m;

server {
    listen 443 ssl;
    server_name demo.example.test;
    ssl_certificate     /etc/floe2-demo/tls/fullchain.pem;
    ssl_certificate_key /etc/floe2-demo/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 4k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 15s;
    keepalive_timeout 15s;
    limit_conn floe_demo_connections 16;
    limit_conn_status 429;
    limit_req zone=floe_demo_requests burst=20 nodelay;
    limit_req_status 429;
    # Never log cookies, bootstrap responses, WS subprotocols or private headers.
    access_log off;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $floe_demo_connection;
    proxy_set_header X-Floe-Service-Client "";
    proxy_set_header X-Floe-Delegation-Key "";
    proxy_set_header Authorization "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    include /etc/floe2-demo/proxy-headers.conf;
    proxy_connect_timeout 3s;
    proxy_read_timeout 40s;
    proxy_send_timeout 15s;
    proxy_buffering off;
    proxy_cache off;
    proxy_next_upstream off;

    location = /demo { proxy_pass http://127.0.0.1:58080; }
    location ^~ /server/ { proxy_pass http://127.0.0.1:58080; }
    location ^~ /server-assets/ { proxy_pass http://127.0.0.1:58080; }
    location = /api/v1/demo/samples { proxy_pass http://127.0.0.1:58080; }
    location = /api/v1/demo/launches {
        # Location limits replace inherited limits: include BOTH here.
        limit_req zone=floe_demo_requests burst=20 nodelay;
        limit_req zone=floe_demo_launches burst=2 nodelay;
        proxy_pass http://127.0.0.1:58080;
    }
    location ^~ /api/v1/server/sessions/ { proxy_pass http://127.0.0.1:58080; }
    location / { return 404; }
}
