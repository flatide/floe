[package]
name = "floe2"
version = "0.1.0"
rust-version = "1.89"
edition.workspace = true
license.workspace = true
description = "floe2: the command line (the shared Rust application CLI) and the GTK viewer's launcher"

[[bin]]
name = "floe2"
path = "src/main.rs"

[dependencies]
floe-app-cli = { path = "../app-cli" }
serde_json = "=1.0.151"
floe-app-core = { path = "../app-core" }
floe-worker-client = { path = "../worker-client" }
