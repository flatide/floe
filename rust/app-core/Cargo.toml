[package]
name = "floe-app-core"
version = "0.1.0"
rust-version = "1.89"
edition.workspace = true
license.workspace = true
description = "Shared Rust application policies for the floe2 CLI and future web service"

[dependencies]
floe-oasis = { path = "../oasis" }
flate2 = "1"
crc32fast = "1"
floe-vfs = { path = "../vfs" }
floe-worker-client = { path = "../worker-client" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
libc = "0.2"
sha1 = "=0.10.7"
