[package]
name = "floe-app"
version = "0.1.0"
rust-version = "1.89"
edition.workspace = true
license.workspace = true
description = "Development Rust-only floe2 application CLI (M1a)"

[[bin]]
name = "floe2-web"
path = "src/main.rs"

[dependencies]
serde_json = "=1.0.151"
floe-app-core = { path = "../app-core" }
floe-web = { path = "../web" }
floe-worker-client = { path = "../worker-client" }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "net", "sync", "time"] }
signal-hook = { version = "=0.4.4", default-features = false }
