[package]
name = "floe-app"
version = "0.1.0"
rust-version = "1.89"
edition.workspace = true
license.workspace = true
description = "floe2-web: the web product's command line - the shared application CLI (floe-app-cli) with the web viewer, server and display test"

[[bin]]
name = "floe2-web"
path = "src/main.rs"

[dependencies]
serde_json = "=1.0.151"
floe-app-cli = { path = "../app-cli" }
floe-app-core = { path = "../app-core" }
floe-web = { path = "../web" }
floe-worker-client = { path = "../worker-client" }
floe-notices = { path = "../notices" }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "net", "sync", "time"] }
