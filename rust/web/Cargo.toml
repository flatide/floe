[package]
name = "floe-web"
version = "0.1.0"
rust-version = "1.89"
edition.workspace = true
license.workspace = true
description = "Authenticated loopback transport for the floe2 web migration"

[dependencies]
floe-app-core = { path = "../app-core" }
floe-worker-client = { path = "../worker-client" }
bytes = "=1.12.1"
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "net", "sync", "time", "macros"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
getrandom = "=0.3.4"
sha1 = "=0.10.7"
subtle = "=2.6.1"
hyper = { version = "=1.11.1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio", "service"] }

[build-dependencies]
sha1 = "=0.10.7"

[dev-dependencies]
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "handshake"] }
